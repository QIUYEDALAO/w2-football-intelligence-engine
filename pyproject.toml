[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "w2-football-intelligence-engine"
version = "0.2.0"
description = "W2 Stage 2 engineering foundation for football intelligence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "coverage>=7.15,<8",
  "cryptography>=45,<46",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "redis>=5,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
w2-gate5-preflight = "w2.gates.gate5_preflight_cli:main"
w2-shadow-comparison-import = "w2.shadow.comparison_import_cli:main"
w2-stage7i-observer = "w2.observability.stage7i_observer_cli:main"
w2-finished-match-scoring = "w2.tracking.finished_match_scoring_cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<4",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pyyaml>=6.0,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/w2"]

# The SC21 role authority matrix stays a single source document under docs/; this
# ships that same file as package data so an installed wheel can read it without a
# checkout on disk. The image installs with --no-editable, so w2 lives in
# site-packages and any path guessed relative to the module lands outside the
# project -- which is how the dashboard came to raise
# SC21_FACTOR_ROLE_AUTHORITY_MATRIX_NOT_FOUND in the released image.
[tool.hatch.build.targets.wheel.force-include]
"docs/review_packages/SC21_FACTOR_INPUT_CHAIN/SC21_FACTOR_ROLE_AUTHORITY_MATRIX.json" = "w2/dashboard/data/SC21_FACTOR_ROLE_AUTHORITY_MATRIX.json"

# The accepted F1R-B modules are the production recording sink's implementation.
# They load their siblings by file path, so the whole set ships together as one
# package directory. The image installs with --no-editable and does not carry
# scripts/, which is exactly the failure mode the SC21 entry above records.
"scripts/quant/f1p_forward_factor_contract.py" = "w2/quant_research/_f1r_b/f1p_forward_factor_contract.py"
"scripts/quant/f1r_a0_offline_factor_recorder.py" = "w2/quant_research/_f1r_b/f1r_a0_offline_factor_recorder.py"
"scripts/quant/f1r_b_source_capture.py" = "w2/quant_research/_f1r_b/f1r_b_source_capture.py"
"scripts/quant/f1r_b_production_ports.py" = "w2/quant_research/_f1r_b/f1r_b_production_ports.py"
"scripts/quant/f1r_b_production_recording_integration.py" = "w2/quant_research/_f1r_b/f1r_b_production_recording_integration.py"
"scripts/quant/f1r_b_observation_store.py" = "w2/quant_research/_f1r_b/f1r_b_observation_store.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"scripts/check_w2_stage1_contracts.py" = ["E", "I"]
"scripts/render_ai_card_text.py" = ["E", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "apps"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.worker.celery_app"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "scripts/quant/tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
markers = [
  "requires_privilege: host-privileged integration checks; opt in with W2_RUN_PRIVILEGED_TESTS=1",
]
