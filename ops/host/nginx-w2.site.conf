server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://w2.ai138.top$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name w2.ai138.top;

  server_tokens off;
  auth_basic "W2";
  auth_basic_user_file /etc/nginx/w2.htpasswd;

  # 压缩：JSON/JS/CSS 等文本响应 gzip（proxy 响应须显式 gzip_proxied any 才会压缩）
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  ssl_certificate /etc/letsencrypt/live/w2.ai138.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/w2.ai138.top/privkey.pem;

  access_log /var/log/nginx/w2.access.log;
  error_log /var/log/nginx/w2.error.log warn;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    auth_basic off;
  }

  location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:18000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ops/ {
    proxy_pass http://127.0.0.1:18000/ops/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:18000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://127.0.0.1:18000/health;
    proxy_set_header Host $host;
  }

  location = /ready {
    proxy_pass http://127.0.0.1:18000/ready;
    proxy_set_header Host $host;
  }
}
