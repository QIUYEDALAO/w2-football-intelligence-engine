# W2 Staging Compose — standalone (no inheritance from docker-compose.yml)
# All business ports bound to 127.0.0.1 only.
# W2_PYTHON_IMAGE and W2_WEB_IMAGE must be immutable registry references ending in @sha256:<digest>.
# Usage: sudo docker compose -f infra/compose/compose.staging.yml --env-file /opt/w2/shared/.env --env-file /opt/w2/shared/release.env -p w2 up -d

name: w2-staging

x-common-env: &common-env
  W2_APP_ROOT: /app
  W2_RUNTIME_ROOT: /app/runtime
  W2_ENVIRONMENT: staging
  W2_GIT_SHA: ${W2_GIT_SHA:-UNKNOWN}
  W2_BUILD_TIME: ${W2_BUILD_TIME:-UNKNOWN}
  W2_RELEASE_ID: ${W2_RELEASE_ID:-UNKNOWN}
  W2_DATABASE_URL: postgresql+psycopg://w2_user:${POSTGRES_PASSWORD}@postgres:5432/w2
  W2_REDIS_URL: redis://redis:6379/0
  W2_CELERY_BROKER_URL: redis://redis:6379/1
  W2_CELERY_RESULT_BACKEND: redis://redis:6379/2
  W2_PROVIDER_CALLS_DISABLED: "true"
  W2_PROVIDER_SCHEDULER_ENABLED: "false"
  W2_PROVIDER_REQUEST_LEDGER_ENABLED: "true"
  W2_PROVIDER_REFRESH_MIN_INTERVAL_SECONDS: "900"
  W2_PROVIDER_ENDPOINT_ALLOWLIST: "status,fixtures,odds,lineups,statistics"
  W2_PROVIDER_REFRESH_TICK_HARD_CAP: "30"
  W2_PROVIDER_DAILY_HARD_CAP: "7500"
  W2_STATISTICS_DAILY_HARD_CAP: "5500"
  W2_PROVIDER_DAILY_UNALLOCATED_BUFFER: "0"
  W2_PROVIDER_DAILY_RESERVE: "1500"
  W2_FIXTURE_DISCOVERY_ENABLED: ${W2_FIXTURE_DISCOVERY_ENABLED:-false}
  W2_FIXTURE_DISCOVERY_INTERVAL_SECONDS: "300"
  W2_MARKET_ANCHOR_DISPLAY_ENABLED: ${W2_MARKET_ANCHOR_DISPLAY_ENABLED:-true}
  W2_MARKET_ANCHOR_MIN_DIVERGENCE: ${W2_MARKET_ANCHOR_MIN_DIVERGENCE:-0.05}
  W2_XG_BACKFILL_ENABLED: "false"
  W2_XG_BACKFILL_REQUEST_BUDGET: "120"
  W2_XG_BACKFILL_RECENT_MATCHES: "5"
  W2_FORWARD_HOLDOUT_AUTORUN: "true"
  W2_FORWARD_HOLDOUT_NETWORK: "true"
  W2_DEEPSEEK_ENABLED: "false"
  W2_RECOMMENDATION_ENABLED: "false"
  W2_CANDIDATE_ENABLED: "true"
  W2_PRODUCTION_RELEASE: "false"
  W2_EXTERNAL_ALERTING: "false"
  W2_API_DAILY_HARD_LIMIT: "6000"
  W2_API_MINIMUM_RESERVE: "1500"
  W2_MARKET_TIMELINE_RUNTIME_ROOT: /app/market_timeline_snapshots
  CELERY_WORKER_CONCURRENCY: "1"
  W2_SERVICE_VERSION: staging-0.1.0
  W2_LINEUP_POLICY_PATH: /app/image_config/policies/lineup_market_policy.v1.json
  W2_API_FOOTBALL_API_KEY: ${W2_API_FOOTBALL_API_KEY}

services:

  postgres:
    image: postgres:16-alpine
    shm_size: 256m
    mem_limit: 1g
    environment:
      POSTGRES_DB: w2
      POSTGRES_USER: w2_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - w2-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w2_user -d w2"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    volumes:
      - redis-data:/data
    networks:
      - w2-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    expose:
      - "6379"

  migration:
    image: ${W2_PYTHON_IMAGE:?immutable Python image reference required}
    command:
      - "alembic"
      - "upgrade"
      - "head"
    environment:
      W2_DATABASE_URL: postgresql+psycopg://w2_user:${POSTGRES_PASSWORD}@postgres:5432/w2
      W2_ENVIRONMENT: staging
      W2_GIT_SHA: ${W2_GIT_SHA:-UNKNOWN}
      W2_BUILD_TIME: ${W2_BUILD_TIME:-UNKNOWN}
      W2_RELEASE_ID: ${W2_RELEASE_ID:-UNKNOWN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - w2-staging
    mem_limit: 1g
    restart: no
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: ${W2_PYTHON_IMAGE:?immutable Python image reference required}
    command:
      - "uvicorn"
      - "apps.api.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - /opt/w2/shared/runtime:/app/runtime
      - /opt/w2/shared/runtime/market_timeline_snapshots:/app/market_timeline_snapshots
    environment:
      <<: *common-env
      W2_IMAGE_ID: ${W2_API_IMAGE_ID:-UNAVAILABLE}
      W2_OCI_DIGEST: ${W2_API_OCI_DIGEST:-UNAVAILABLE}
      W2_REGISTRY_DIGEST: ${W2_API_REGISTRY_DIGEST:-UNAVAILABLE}
      W2_FORMAL_RECOMMENDATION_ENABLED: ${W2_FORMAL_RECOMMENDATION_ENABLED:-false}
      W2_READINESS_RELEASE_ROOT: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5); assert r.status==200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - w2-staging
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

  worker:
    image: ${W2_PYTHON_IMAGE:?immutable Python image reference required}
    command:
      - "celery"
      - "-A"
      - "apps.worker.celery_app"
      - "worker"
      - "--loglevel=INFO"
      - "--concurrency=1"
      - "--max-tasks-per-child=10"
      - "--max-memory-per-child=1200000"
    volumes:
      - /opt/w2/shared/runtime:/app/runtime
      - /opt/w2/shared/runtime/market_timeline_snapshots:/app/market_timeline_snapshots
    environment:
      <<: *common-env
      W2_FORMAL_RECOMMENDATION_ENABLED: ${W2_FORMAL_RECOMMENDATION_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from apps.worker.celery_app import ping; assert ping.run() == 'pong'; assert os.path.isdir('/app/runtime')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - w2-staging
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

  scheduler:
    image: ${W2_PYTHON_IMAGE:?immutable Python image reference required}
    command:
      - "python"
      - "-m"
      - "apps.scheduler.main"
    volumes:
      - /opt/w2/shared/runtime:/app/runtime
      - /opt/w2/shared/runtime/market_timeline_snapshots:/app/market_timeline_snapshots
    environment:
      <<: *common-env
      W2_FUTURE_FIXTURE_REFRESH_ENABLED: "false"
      W2_FORWARD_OUTCOME_LEDGER_ENABLED: ${W2_FORWARD_OUTCOME_LEDGER_ENABLED:-true}
      W2_FORWARD_OUTCOME_LEDGER_INTERVAL_SECONDS: ${W2_FORWARD_OUTCOME_LEDGER_INTERVAL_SECONDS:-600}
      W2_FORWARD_OUTCOME_LEDGER_WINDOW: ${W2_FORWARD_OUTCOME_LEDGER_WINDOW:-next7}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from apps.scheduler.main import fixture_discovery_enabled, heartbeat, future_fixture_refresh_contract_ready, future_fixture_refresh_enabled; assert 'heartbeat' in heartbeat(); assert not future_fixture_refresh_enabled() or future_fixture_refresh_contract_ready(); assert isinstance(fixture_discovery_enabled(), bool)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - w2-staging
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

  web:
    image: ${W2_WEB_IMAGE:?immutable Web image reference required}
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      W2_ENVIRONMENT: staging
    volumes:
      - /opt/w2/shared/runtime/reports/public:/usr/share/nginx/html/static-report:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - w2-staging
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

networks:
  w2-staging:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
