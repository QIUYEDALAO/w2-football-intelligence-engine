[Service]
ExecStart=
ExecStart=/usr/bin/sudo /usr/bin/docker compose \
  -f /opt/w2/deploy/compose.staging.yml \
  -f /opt/w2/deploy/controlled-future-refresh.override.yml \
  -f /opt/w2/deploy/production-coverage.override.yml \
  --env-file /opt/w2/shared/.env \
  --env-file /opt/w2/shared/release.env \
  up -d --remove-orphans api worker scheduler web

ExecStop=
ExecStop=/usr/bin/sudo /usr/bin/docker compose \
  -f /opt/w2/deploy/compose.staging.yml \
  -f /opt/w2/deploy/controlled-future-refresh.override.yml \
  -f /opt/w2/deploy/production-coverage.override.yml \
  --env-file /opt/w2/shared/.env \
  --env-file /opt/w2/shared/release.env \
  down

ExecReload=
ExecReload=/usr/bin/sudo /usr/bin/docker compose \
  -f /opt/w2/deploy/compose.staging.yml \
  -f /opt/w2/deploy/controlled-future-refresh.override.yml \
  -f /opt/w2/deploy/production-coverage.override.yml \
  --env-file /opt/w2/shared/.env \
  --env-file /opt/w2/shared/release.env \
  restart

ExecStartPost=
ExecStartPost=/usr/bin/sudo /usr/bin/docker compose \
  -f /opt/w2/deploy/compose.staging.yml \
  -f /opt/w2/deploy/controlled-future-refresh.override.yml \
  -f /opt/w2/deploy/production-coverage.override.yml \
  --env-file /opt/w2/shared/.env \
  --env-file /opt/w2/shared/release.env \
  ps
