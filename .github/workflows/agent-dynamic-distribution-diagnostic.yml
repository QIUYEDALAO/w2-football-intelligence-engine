name: Apply dynamic distribution diagnostic

on:
  push:
    branches: ["agent/eval-02b-c9-lineup-event-ordering"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[distribution-diagnostic-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eval-02b-c9-lineup-event-ordering
          fetch-depth: 0
      - name: Add narrow predeploy diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_predeploy_e2e_smoke.sh")
          text = path.read_text(encoding="utf-8")
          old = '''def calculate(
    scoped_repository: ScopedAnalysisRepository,
    target_fixture_id: str,
    evaluated_at: datetime,
) -> dict[str, object] | None:
    return ReadModelService(repository=scoped_repository).public_analysis_card_bounded(
        target_fixture_id,
        evaluation_time=evaluated_at,
        use_frozen_canary=False,
    )
'''
          new = '''def calculate(
    scoped_repository: ScopedAnalysisRepository,
    target_fixture_id: str,
    evaluated_at: datetime,
) -> dict[str, object] | None:
    card = ReadModelService(repository=scoped_repository).public_analysis_card_bounded(
        target_fixture_id,
        evaluation_time=evaluated_at,
        use_frozen_canary=False,
    )
    if isinstance(card, dict):
        candidates = card.get("market_candidates")
        if isinstance(candidates, dict):
            for market_key, candidate in candidates.items():
                if not isinstance(candidate, dict):
                    continue
                evidence = candidate.get("analysis_evidence")
                sides = evidence.get("side_evidence") if isinstance(evidence, dict) else None
                if not isinstance(sides, dict):
                    continue
                for selection, side in sides.items():
                    model = side.get("model_probability") if isinstance(side, dict) else None
                    if not isinstance(model, dict) or model.get("status") != "READY":
                        continue
                    distribution = model.get("settlement_distribution")
                    total = (
                        sum(float(value) for value in distribution.values())
                        if isinstance(distribution, dict)
                        else None
                    )
                    print(
                        "DYNAMIC_DISTRIBUTION_DIAGNOSTIC",
                        market_key,
                        selection,
                        repr(distribution),
                        repr(total),
                    )
    return card
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one calculate block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/agent-dynamic-distribution-diagnostic.yml").unlink()
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git add scripts/run_predeploy_e2e_smoke.sh \
                  .github/workflows/agent-dynamic-distribution-diagnostic.yml
          git commit -m "test: expose invalid dynamic distribution [distribution-diagnostic-applied]"
          git push origin HEAD:agent/eval-02b-c9-lineup-event-ordering
