name: Run C9 lint and full-matrix correction

on:
  push:
    branches: ["agent/eval-02b-c9-ci-fix-runner"]

permissions:
  contents: write

jobs:
  patch-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eval-02b-c9-lineup-event-ordering
          fetch-depth: 0
      - name: Correct imports, preserve strict predeploy assertion, and remove staging workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("tests/integration/test_future_refresh_db_persistence.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''from __future__ import annotations

from datetime import UTC, datetime, timedelta
from pathlib import Path
from typing import Any

from sqlalchemy import create_engine, func, select
from sqlalchemy.orm import Session

import pytest
'''
          new = '''from __future__ import annotations

import json
from datetime import UTC, datetime, timedelta
from pathlib import Path
from typing import Any

import pytest
from sqlalchemy import create_engine, func, select
from sqlalchemy.orm import Session
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected integration-test import block")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          smoke_path = Path("scripts/run_predeploy_e2e_smoke.sh")
          smoke = smoke_path.read_text(encoding="utf-8")
          target = '''def materialize_predeploy_events(events: list[Any]) -> list[str]:
    event_types = {str(event.event_type) for event in events}
'''
          replacement = '''# C9 frozen acceptance: this exact event set is a required runtime contract.
# Do not downgrade a missing LINEUP_CHANGED event to a successful empty result.
def materialize_predeploy_events(events: list[Any]) -> list[str]:
    event_types = {str(event.event_type) for event in events}
'''
          if smoke.count(target) != 1:
              raise SystemExit("strict predeploy materializer target not found exactly once")
          smoke_path.write_text(smoke.replace(target, replacement, 1), encoding="utf-8")

          stale = Path(".github/workflows/agent-c9-ci-fix.yml")
          if not stale.is_file():
              raise SystemExit("stale target-branch workflow not found")
          stale.unlink()
          PY
      - name: Commit target branch correction
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git add tests/integration/test_future_refresh_db_persistence.py \
                  scripts/run_predeploy_e2e_smoke.sh \
                  .github/workflows/agent-c9-ci-fix.yml
          git commit -m "test: enforce strict C9 full-matrix acceptance"
          git push origin HEAD:agent/eval-02b-c9-lineup-event-ordering
