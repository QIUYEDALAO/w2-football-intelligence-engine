name: Apply evidence-backed C9 PR correction

on:
  pull_request:
    branches: ["main"]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.number == 453 && !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eval-02b-c9-lineup-event-ordering
          fetch-depth: 0
      - name: Apply only evidence-backed corrections
