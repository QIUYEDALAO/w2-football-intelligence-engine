name: W2 Path-Aware CI

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete CI matrix on the selected exact head
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      python_focused: ${{ steps.plan.outputs.python_focused }}
      web: ${{ steps.plan.outputs.web }}
      migration: ${{ steps.plan.outputs.migration }}
      compose: ${{ steps.plan.outputs.compose }}
      staging_parity: ${{ steps.plan.outputs.staging_parity }}
      predeploy_e2e: ${{ steps.plan.outputs.predeploy_e2e }}
      verify: ${{ steps.plan.outputs.verify }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [[ "$FORCE_FULL" == "true" ]]; then
            python3 scripts/classify_ci.py \
              --path docs/force-full.md \
              --force-full \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/classify_ci.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

  python-focused:
    name: python-focused
    needs: classify
    if: needs.classify.outputs.python_focused == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: w2
          POSTGRES_USER: w2_user
          POSTGRES_PASSWORD: placeholder_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w2_user -d w2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      W2_ENVIRONMENT: test
      W2_DATABASE_URL: postgresql+psycopg://w2_user:placeholder_password@127.0.0.1:5432/w2
      W2_TEST_POSTGRES_URL: postgresql+psycopg://w2_user:placeholder_password@127.0.0.1:5432/w2
      W2_REDIS_URL: redis://127.0.0.1:6379/0
      W2_CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      W2_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      W2_PROVIDER_CALLS_DISABLED: "true"
      W2_PROVIDER_SCHEDULER_ENABLED: "false"
      W2_XG_BACKFILL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Install Python 3.12 dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Focused Python checks
        run: |
          uv run --python 3.12 ruff check .
          uv run --python 3.12 mypy src apps
          uv run --python 3.12 pytest -q tests/unit tests/contract
      - name: Secret pattern scan
        run: uv run --python 3.12 python tests/secret_scan.py

  web:
    name: web
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Boss Decision Console protected baseline
        run: python3 scripts/check_boss_console_baseline.py
      - name: Web typecheck
        run: npm --prefix apps/web run typecheck
      - name: Web build
        run: npm --prefix apps/web run build
      - name: Web E2E
        run: npm --prefix apps/web run test:e2e

  migration:
    name: migration-schema
    needs: classify
    if: needs.classify.outputs.migration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: w2
          POSTGRES_USER: w2_user
          POSTGRES_PASSWORD: placeholder_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w2_user -d w2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      W2_ENVIRONMENT: test
      W2_DATABASE_URL: postgresql+psycopg://w2_user:placeholder_password@127.0.0.1:5432/w2
      W2_TEST_POSTGRES_URL: postgresql+psycopg://w2_user:placeholder_password@127.0.0.1:5432/w2
      W2_PROVIDER_CALLS_DISABLED: "true"
      W2_PROVIDER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Python 3.12 dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Alembic upgrade downgrade upgrade
        run: |
          uv run --python 3.12 alembic upgrade head
          uv run --python 3.12 alembic downgrade -1
          uv run --python 3.12 alembic upgrade head
      - name: Migration integration tests
        run: uv run --python 3.12 pytest -q tests/integration/test_migrations.py

  compose:
    name: compose
    needs: classify
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose config
        run: docker compose config

  staging-parity:
    name: staging-parity
    needs: classify
    if: needs.classify.outputs.staging_parity == 'true'
    runs-on: ubuntu-latest
    env:
      W2_ENVIRONMENT: test
      W2_PROVIDER_CALLS_DISABLED: "true"
      W2_PROVIDER_SCHEDULER_ENABLED: "false"
      W2_PROVIDER_REFRESH_MIN_INTERVAL_SECONDS: "900"
      W2_PROVIDER_ENDPOINT_ALLOWLIST: "status,fixtures,odds,lineups"
      W2_PROVIDER_REFRESH_TICK_HARD_CAP: "30"
      W2_XG_BACKFILL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Python 3.12 dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Future refresh staging parity
        run: |
          uv run --python 3.12 pytest -q \
            tests/integration/test_future_refresh_staging_parity.py \
            tests/integration/test_future_refresh_e2e_smoke.py
      - name: Future refresh staging contract
        run: uv run --python 3.12 python scripts/check_w2_future_refresh_staging_contract.py
      - name: Secret pattern scan
        run: uv run --python 3.12 python tests/secret_scan.py

  predeploy-e2e:
    name: predeploy-e2e
    needs: classify
    if: needs.classify.outputs.predeploy_e2e == 'true'
    runs-on: ubuntu-latest
    env:
      W2_ENVIRONMENT: test
      W2_PROVIDER_CALLS_DISABLED: "true"
      W2_PROVIDER_SCHEDULER_ENABLED: "false"
      W2_PROVIDER_REFRESH_MIN_INTERVAL_SECONDS: "900"
      W2_PROVIDER_ENDPOINT_ALLOWLIST: "status,fixtures,odds,lineups"
      W2_PROVIDER_REFRESH_TICK_HARD_CAP: "30"
      W2_XG_BACKFILL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Python 3.12 dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Predeploy e2e staging smoke
        run: bash scripts/run_predeploy_e2e_smoke.sh
      - name: Predeploy e2e regression contracts
        run: |
          uv run --python 3.12 pytest -q \
            tests/contract/test_predeploy_e2e_regressions.py \
            tests/unit/test_analysis_card_api.py::test_read_model_repository_merges_dashboard_and_db_fixtures \
            tests/unit/test_analysis_card_api.py::test_analysis_card_falls_back_for_db_fixture_when_dashboard_exists
      - name: Secret pattern scan
        run: uv run --python 3.12 python tests/secret_scan.py

  verify:
    name: verify
    needs: classify
    if: needs.classify.outputs.verify == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: w2
          POSTGRES_USER: w2_user
          POSTGRES_PASSWORD: placeholder_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w2_user -d w2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      W2_ENVIRONMENT: test
      W2_DATABASE_URL: postgresql+psycopg://w2_user:placeholder_password@127.0.0.1:5432/w2
      W2_TEST_POSTGRES_URL: postgresql+psycopg://w2_user:placeholder_password@127.0.0.1:5432/w2
      W2_REDIS_URL: redis://127.0.0.1:6379/0
      W2_CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      W2_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      W2_PROVIDER_CALLS_DISABLED: "true"
      W2_PROVIDER_SCHEDULER_ENABLED: "false"
      W2_PROVIDER_REFRESH_MIN_INTERVAL_SECONDS: "900"
      W2_PROVIDER_ENDPOINT_ALLOWLIST: "status,fixtures,odds,lineups"
      W2_PROVIDER_REFRESH_TICK_HARD_CAP: "30"
      W2_XG_BACKFILL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Install Python 3.12 dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Stage 1 contract checker
        run: uv run --python 3.12 python scripts/check_w2_stage1_contracts.py
      - name: Tracked output guard
        run: uv run --python 3.12 python scripts/check_tracked_outputs.py
      - name: All-stage checker
        run: uv run --python 3.12 python scripts/check_w2_all.py
      - name: Ruff
        run: uv run --python 3.12 ruff check .
      - name: Mypy
        run: uv run --python 3.12 mypy src apps
      - name: Pytest
        run: uv run --python 3.12 pytest -q
      - name: Secret pattern scan
        run: uv run --python 3.12 python tests/secret_scan.py

  images:
    name: images
    permissions:
      contents: read
      packages: write
    needs:
      - classify
      - python-focused
      - web
      - migration
      - compose
      - staging-parity
      - predeploy-e2e
      - verify
    if: >-
      always() &&
      needs.classify.outputs.images == 'true' &&
      needs.classify.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      PYTHON_IMAGE: ghcr.io/qiuyedalao/w2-football-intelligence-engine/python
      WEB_IMAGE: ghcr.io/qiuyedalao/w2-football-intelligence-engine/web
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every scheduled quality job to succeed
        run: |
          python3 scripts/classify_ci.py \
            --expected-job python_focused=${{ needs.classify.outputs.python_focused }} \
            --expected-job web=${{ needs.classify.outputs.web }} \
            --expected-job migration=${{ needs.classify.outputs.migration }} \
            --expected-job compose=${{ needs.classify.outputs.compose }} \
            --expected-job staging_parity=${{ needs.classify.outputs.staging_parity }} \
            --expected-job predeploy_e2e=${{ needs.classify.outputs.predeploy_e2e }} \
            --expected-job verify=${{ needs.classify.outputs.verify }} \
            --expected-job images=false \
            --result classify=${{ needs.classify.result }} \
            --result python_focused=${{ needs['python-focused'].result }} \
            --result web=${{ needs.web.result }} \
            --result migration=${{ needs.migration.result }} \
            --result compose=${{ needs.compose.result }} \
            --result staging_parity=${{ needs['staging-parity'].result }} \
            --result predeploy_e2e=${{ needs['predeploy-e2e'].result }} \
            --result verify=${{ needs.verify.result }} \
            --result images=skipped
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
      - name: Build and push unified Python image
        id: python
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          push: true
          tags: ${{ env.PYTHON_IMAGE }}:${{ env.EXACT_HEAD }}
          build-args: |
            W2_GIT_SHA=${{ env.EXACT_HEAD }}
            W2_RELEASE_ID=${{ env.EXACT_HEAD }}
            W2_BUILD_TIME=${{ steps.build-meta.outputs.created }}
          cache-from: type=gha,scope=w2-python
          cache-to: type=gha,mode=max,scope=w2-python
      - name: Build and push Web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.EXACT_HEAD }}
          build-args: |
            VITE_GIT_SHA=${{ env.EXACT_HEAD }}
            W2_RELEASE_ID=${{ env.EXACT_HEAD }}
            VITE_BUILD_TIME=${{ steps.build-meta.outputs.created }}
            VITE_DASHBOARD_DATA_MODE=api
            VITE_W2_MARKET_ANCHOR_DISPLAY_ENABLED=true
            VITE_W2_MARKET_ANCHOR_MIN_DIVERGENCE=0.05
          cache-from: type=gha,scope=w2-web
          cache-to: type=gha,mode=max,scope=w2-web
      - name: Smoke final immutable images
        env:
          PYTHON_DIGEST: ${{ steps.python.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        run: |
          python_ref="${PYTHON_IMAGE}@${PYTHON_DIGEST}"
          web_ref="${WEB_IMAGE}@${WEB_DIGEST}"
          docker run --rm --entrypoint python "$python_ref" -c \
            "from apps.api.main import app; assert app"
          docker run --rm --entrypoint python "$python_ref" -c \
            "from apps.worker.celery_app import ping; assert ping.run() == 'pong'"
          docker run --rm --entrypoint python "$python_ref" -c \
            "from apps.scheduler.main import heartbeat; assert 'heartbeat' in heartbeat()"
          docker run --rm --entrypoint alembic "$python_ref" --help >/dev/null
          smoke_network="w2-image-smoke-${GITHUB_RUN_ID}"
          docker network create "$smoke_network" >/dev/null
          api_id="$(docker run -d --network "$smoke_network" --network-alias api \
            --entrypoint python "$python_ref" -m http.server 8000)"
          web_id="$(docker run -d --network "$smoke_network" -p 18081:8080 "$web_ref")"
          trap 'docker rm -f "$web_id" "$api_id" >/dev/null 2>&1 || true; docker network rm "$smoke_network" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$web_id"
          exit 1
      - name: Record immutable image digests
        env:
          PYTHON_DIGEST: ${{ steps.python.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        run: |
          {
            printf 'EXACT_HEAD=%s\n' "$EXACT_HEAD"
            printf 'W2_PYTHON_IMAGE=%s@%s\n' "$PYTHON_IMAGE" "$PYTHON_DIGEST"
            printf 'W2_WEB_IMAGE=%s@%s\n' "$WEB_IMAGE" "$WEB_DIGEST"
          } | tee "$RUNNER_TEMP/image-digests.env" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ env.EXACT_HEAD }}
          path: ${{ runner.temp }}/image-digests.env
          if-no-files-found: error
          retention-days: 30

  ci-required:
    name: CI_REQUIRED
    if: always()
    needs:
      - classify
      - python-focused
      - web
      - migration
      - compose
      - staging-parity
      - predeploy-e2e
      - verify
      - images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every scheduled job to succeed
        shell: bash
        run: |
          python3 scripts/classify_ci.py \
            --expected-job python_focused=${{ needs.classify.outputs.python_focused }} \
            --expected-job web=${{ needs.classify.outputs.web }} \
            --expected-job migration=${{ needs.classify.outputs.migration }} \
            --expected-job compose=${{ needs.classify.outputs.compose }} \
            --expected-job staging_parity=${{ needs.classify.outputs.staging_parity }} \
            --expected-job predeploy_e2e=${{ needs.classify.outputs.predeploy_e2e }} \
            --expected-job verify=${{ needs.classify.outputs.verify }} \
            --expected-job images=${{ needs.classify.outputs.images }} \
            --result classify=${{ needs.classify.result }} \
            --result python_focused=${{ needs['python-focused'].result }} \
            --result web=${{ needs.web.result }} \
            --result migration=${{ needs.migration.result }} \
            --result compose=${{ needs.compose.result }} \
            --result staging_parity=${{ needs['staging-parity'].result }} \
            --result predeploy_e2e=${{ needs['predeploy-e2e'].result }} \
            --result verify=${{ needs.verify.result }} \
            --result images=${{ needs.images.result }}
