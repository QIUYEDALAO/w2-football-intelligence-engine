name: W2 Context-Only Release Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: context-only-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify_context:
    runs-on: ubuntu-latest
    outputs:
      context_only: ${{ steps.classify.outputs.context_only }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path, PurePosixPath

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          output = Path(os.environ["GITHUB_OUTPUT"])

          changed = subprocess.run(
              ["git", "diff", "--no-renames", "--name-only", f"{base}...{head}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          top_level_context = {
              ".github/copilot-instructions.md",
              "AGENTS.md",
              "AI_PROJECT_CONTEXT.md",
              "AI_QUANT_PROJECT_CONTEXT.md",
              "CLAUDE.md",
              "NEXT_ACTION.md",
              "PROJECT_LEDGER.md",
              "PROJECT_STATE.yaml",
              "QUANT_AGENTS.md",
              "QUANT_PROJECT_STATE.yaml",
              "README.md",
          }
          bootstrap_workflow = ".github/workflows/context-only-release.yml"
          bootstrap_secret_scan = "tests/secret_scan.py"

          def base_has(path: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{base}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

          def secret_scan_bootstrap_is_exact() -> bool:
              try:
                  before = subprocess.run(
                      ["git", "show", f"{base}:{bootstrap_secret_scan}"],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout
                  after = Path(bootstrap_secret_scan).read_text(encoding="utf-8")
              except (subprocess.CalledProcessError, FileNotFoundError):
                  return False
              expected = before.replace(
                  '    "secret scan",\n',
                  '    "secret scan",\n    "Secret 扫描",\n',
                  1,
              )
              return after == expected

          def allowed(path: str) -> bool:
              pure = PurePosixPath(path)
              if pure.is_absolute() or ".." in pure.parts or path in {"", "."}:
                  return False
              if path in top_level_context:
                  return True
              if path.startswith("docs/") and pure.suffix.lower() in {
                  ".md",
                  ".markdown",
                  ".yaml",
                  ".yml",
                  ".json",
              }:
                  return True
              if path.startswith("tests/contract/") and pure.name.startswith("test_"):
                  return "context" in pure.name or pure.name == "test_delivery_status_documentation.py"
              if path == bootstrap_workflow:
                  # One-time bootstrap only. Any later change to this gate requires the normal RC.
                  return not base_has(path)
              if path == bootstrap_secret_scan:
                  # One-time exact allowlist wording addition used by protocol v2.3.1.
                  return secret_scan_bootstrap_is_exact()
              return False

          rejected = [path for path in changed if not allowed(path)]
          context_only = bool(changed) and not rejected
          reason = "context-only" if context_only else "rejected:" + ",".join(rejected)
          with output.open("a", encoding="utf-8") as fh:
              fh.write(f"context_only={str(context_only).lower()}\n")
              fh.write(f"reason={reason}\n")

          print(f"CONTEXT_ONLY={str(context_only).lower()}")
          print(f"CHANGED_COUNT={len(changed)}")
          if rejected:
              print("REJECTED_PATHS=" + ",".join(rejected))
          PY

  context_release:
    needs: classify_context
    name: ${{ needs.classify_context.outputs.context_only == 'true' && 'RELEASE_REQUIRED' || 'CONTEXT_ONLY_NOT_APPLICABLE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Explain normal runtime path
        if: needs.classify_context.outputs.context_only != 'true'
        run: |
          echo "This PR is not context-only. The normal exact-head Release Candidate remains required."
          echo "${{ needs.classify_context.outputs.reason }}"

      - uses: astral-sh/setup-uv@v3
        if: needs.classify_context.outputs.context_only == 'true'
        with:
          enable-cache: true

      - name: Install validation dependencies
        if: needs.classify_context.outputs.context_only == 'true'
        run: uv sync --python 3.12 --all-groups --frozen

      - name: Validate context-only authority changes
        if: needs.classify_context.outputs.context_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
          uv run python scripts/check_tracked_outputs.py
          uv run pytest -q \
            tests/contract/test_quant_research_context.py \
            tests/contract/test_delivery_status_documentation.py \
            tests/contract/test_delivery_pipeline.py
          uv run python tests/secret_scan.py
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (Path("PROJECT_STATE.yaml"), Path("QUANT_PROJECT_STATE.yaml")):
              if path.exists():
                  value = yaml.safe_load(path.read_text(encoding="utf-8"))
                  if not isinstance(value, dict):
                      raise SystemExit(f"{path}: expected a YAML mapping")
          print("context YAML parse PASS")
          PY

      - name: Context-only release decision
        if: needs.classify_context.outputs.context_only == 'true'
        run: |
          echo "CHANGE_CLASS=CONTEXT_ONLY"
          echo "QUALITY_GATE=LIGHTWEIGHT_CONTEXT"
          echo "IMAGES_REQUIRED=false"
          echo "DEPLOYABLE=false"
          echo "RELEASE_REQUIRED=success"
