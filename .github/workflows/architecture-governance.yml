name: W2 Architecture Governance

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  pre-merge-readiness:
    name: PRE_MERGE_READINESS_GATE
    if: >-
      ((github.event_name == 'pull_request_target' ||
        github.event_name == 'pull_request_review') &&
       github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.pull_request.base.sha ||
                github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Install governance dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Validate exact-head implementation readiness
        env:
          GITHUB_TOKEN: ${{ github.token }} # token = trusted base workflow only
        run: >-
          uv run --python 3.12 python scripts/check_architecture_governance.py pre-merge
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --checklist-ref "${{ github.event.pull_request.head.sha }}"
          --live

  post-merge-consistency:
    name: POST_MERGE_CHECKLIST_CONSISTENCY_GATE
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request_target' &&
                github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Install governance dependencies
        run: uv sync --python 3.12 --all-groups --frozen
      - name: Reconcile DONE tasks with merged pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }} # token = trusted base workflow only
        run: >-
          uv run --python 3.12 python scripts/check_architecture_governance.py post-merge
          --repository "$GITHUB_REPOSITORY"
          --checklist-ref
          "${{ github.event.pull_request.head.sha || github.sha }}"
          --live
