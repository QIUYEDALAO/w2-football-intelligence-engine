name: W2 Architecture Governance

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-merge-readiness:
    name: PRE_MERGE_READINESS_GATE
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate exact-head implementation readiness
        env:
          GH_TOKEN: ${{ github.token }} # token = read-only GitHub Actions credential
        run: >-
          python3 scripts/check_architecture_governance.py pre-merge
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"

  post-merge-consistency:
    name: POST_MERGE_CHECKLIST_CONSISTENCY_GATE
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}
      - name: Reconcile DONE tasks with merged pull requests
        env:
          GH_TOKEN: ${{ github.token }} # token = read-only GitHub Actions credential
        run: >-
          python3 scripts/check_architecture_governance.py post-merge
          --repository "$GITHUB_REPOSITORY"
