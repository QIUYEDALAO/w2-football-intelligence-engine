name: Apply exact C9 remediation patch

on:
  push:
    branches: ["agent/eval-02b-c9-lineup-event-ordering"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-c9-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eval-02b-c9-lineup-event-ordering
          fetch-depth: 0
      - name: Apply code and failure-injection changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          future = Path("src/w2/ingestion/future_refresh.py")

          replace_once(
              future,
              '''        self._projection_events: dict[tuple[str, str, str], ProjectionSourceEvent] = {}\n''',
              '''        self._projection_events: dict[tuple[str, str, str], ProjectionSourceEvent] = {}\n        self._lineup_materialization_rows: dict[tuple[str, str], int] = {}\n''',
          )

          replace_once(
              future,
              '''            future_fixtures = self._future_fixtures(fixtures_response.payload)\n            odds_responses = self._fetch_market_snapshots(future_fixtures)\n''',
              '''            future_fixtures = self._future_fixtures(fixtures_response.payload)\n            self._persist_fixture_identities_before_enrichment(\n                fixtures_response=fixtures_response,\n                fixtures=future_fixtures,\n            )\n            odds_responses = self._fetch_market_snapshots(future_fixtures)\n''',
          )

          replace_once(
              future,
              '''            if self.config.persistence == "db" and (\n                endpoint_capture_error is not None or endpoint_capture_id is None\n            ):\n                raise FutureRefreshError(f"ENDPOINT_CAPTURE_WRITE_FAILED:{endpoint_capture_error}")\n            self._audit.append(\n''',
              '''            if self.config.persistence == "db" and (\n                endpoint_capture_error is not None or endpoint_capture_id is None\n            ):\n                raise FutureRefreshError(f"ENDPOINT_CAPTURE_WRITE_FAILED:{endpoint_capture_error}")\n            self._record_lineup_projection_after_capture(\n                endpoint=endpoint,\n                params=params,\n                payload_hash=payload_sha,\n                response=response,\n            )\n            self._audit.append(\n''',
          )

          old_lineup = '''                if endpoint == "lineups":\n                    fixture_id = str(params.get("fixture") or "")\n                    if not fixture_id:\n                        return False, "LINEUP_FIXTURE_ID_MISSING"\n                    try:\n                        previous_identity = repository.confirmed_lineup_business_identity(\n                            fixture_id=fixture_id\n                        )\n                        lineup_rows = repository.save_lineup_snapshots(\n                            fixture_id=fixture_id,\n                            captured_at=response.captured_at,\n                            raw_sha256=payload_hash,\n                            payload=payload,\n                        )\n                        current_identity = repository.confirmed_lineup_business_identity(\n                            fixture_id=fixture_id\n                        )\n                        if (\n                            lineup_rows > 0\n                            and current_identity is not None\n                            and current_identity != previous_identity\n                        ):\n                            self._record_projection_event(\n                                ProjectionSourceEvent.create(\n                                    fixture_id=fixture_id,\n                                    event_type="LINEUP_CHANGED",\n                                    event_id=f"lineup:{current_identity}",\n                                    event_at=response.captured_at,\n                                    payload={\n                                        "lineup_business_identity": current_identity,\n                                        "materialized_rows": lineup_rows,\n                                    },\n                                )\n                            )\n                    except FutureRefreshPersistenceError:\n                        # The raw response remains valid audit evidence even when\n                        # an incomplete/unidentified XI must fail closed for\n                        # lineup-feature materialization.\n                        pass\n'''
          new_lineup = '''                if endpoint == "lineups":\n                    fixture_id = str(params.get("fixture") or "")\n                    if not fixture_id:\n                        return False, "LINEUP_FIXTURE_ID_MISSING"\n                    try:\n                        lineup_rows = repository.save_lineup_snapshots(\n                            fixture_id=fixture_id,\n                            captured_at=response.captured_at,\n                            raw_sha256=payload_hash,\n                            payload=payload,\n                        )\n                    except FutureRefreshPersistenceError as exc:\n                        self._raw_payload_written.add(payload_hash)\n                        self._raw_payload_written_count += 1\n                        raise FutureRefreshError(\n                            f"LINEUP_MATERIALIZATION_FAILED:{exc}"\n                        ) from exc\n                    self._lineup_materialization_rows[(fixture_id, payload_hash)] = lineup_rows\n'''
          replace_once(future, old_lineup, new_lineup)

          replace_once(
              future,
              '''        except Exception as exc:\n            return False, exc.__class__.__name__\n        self._raw_payload_written.add(payload_hash)\n''',
              '''        except FutureRefreshError:\n            raise\n        except Exception as exc:\n            return False, exc.__class__.__name__\n        self._raw_payload_written.add(payload_hash)\n''',
          )

          replace_once(
              future,
              '''    def _record_projection_event(self, event: ProjectionSourceEvent) -> None:\n        self._projection_events[(event.fixture_id, event.event_type, event.event_id)] = event\n''',
              '''    def _record_lineup_projection_after_capture(\n        self,\n        *,\n        endpoint: str,\n        params: dict[str, str],\n        payload_hash: str,\n        response: LiveApiFootballResponse,\n    ) -> None:\n        if self.config.persistence != "db" or endpoint != "lineups":\n            return\n        fixture_id = str(params.get("fixture") or "")\n        if not fixture_id:\n            raise FutureRefreshError("LINEUP_FIXTURE_ID_MISSING")\n        materialized_rows = self._lineup_materialization_rows.pop(\n            (fixture_id, payload_hash),\n            None,\n        )\n        if materialized_rows is None:\n            raise FutureRefreshError("LINEUP_MATERIALIZATION_RECEIPT_MISSING")\n        if materialized_rows == 0:\n            return\n        try:\n            current_identity = self._db_repository().confirmed_lineup_business_identity(\n                fixture_id=fixture_id\n            )\n        except FutureRefreshPersistenceError as exc:\n            raise FutureRefreshError(\n                f"LINEUP_EVENT_DERIVATION_FAILED:{exc}"\n            ) from exc\n        if current_identity is None:\n            raise FutureRefreshError(\n                "LINEUP_EVENT_DERIVATION_FAILED:LINEUP_BUSINESS_IDENTITY_MISSING"\n            )\n        self._record_projection_event(\n            ProjectionSourceEvent.create(\n                fixture_id=fixture_id,\n                event_type="LINEUP_CHANGED",\n                event_id=f"lineup:{current_identity}",\n                event_at=response.captured_at,\n                payload={\n                    "lineup_business_identity": current_identity,\n                    "materialized_rows": materialized_rows,\n                },\n            )\n        )\n\n    def _record_projection_event(self, event: ProjectionSourceEvent) -> None:\n        self._projection_events[(event.fixture_id, event.event_type, event.event_id)] = event\n''',
          )

          replace_once(
              future,
              '''    def _fetch_market_snapshots(\n''',
              '''    def _persist_fixture_identities_before_enrichment(\n        self,\n        *,\n        fixtures_response: LiveApiFootballResponse,\n        fixtures: list[dict[str, Any]],\n    ) -> None:\n        if self.config.persistence != "db":\n            return\n        from w2.matchday.repository import (\n            MatchdayRepositoryError,\n            MatchdayRuntimeRepository,\n        )\n\n        repository = MatchdayRuntimeRepository()\n        try:\n            fixture_identities = self._fixture_identities_from_response(\n                fixtures_response=fixtures_response,\n                fixtures=fixtures,\n            )\n            for fixture_identity in fixture_identities:\n                _persisted, changed_fixture_ids = (\n                    repository.upsert_fixture_identities_with_business_changes(\n                        [fixture_identity]\n                    )\n                )\n                if not changed_fixture_ids:\n                    continue\n                fixture_id = str(\n                    fixture_identity.get("provider_fixture_id")\n                    or fixture_identity.get("fixture_id")\n                    or ""\n                )\n                if not fixture_id:\n                    raise FutureRefreshError(\n                        "FIXTURE_IDENTITY_PROVIDER_FIXTURE_ID_MISSING"\n                    )\n                self._record_projection_event(\n                    ProjectionSourceEvent.create(\n                        fixture_id=fixture_id,\n                        event_type="FIXTURE_CHANGED",\n                        event_id=(\n                            "fixture:"\n                            + str(fixture_identity.get("identity_hash") or "")\n                        ),\n                        event_at=fixtures_response.captured_at,\n                        payload=fixture_identity,\n                    )\n                )\n        except MatchdayRepositoryError as exc:\n            raise FutureRefreshError(\n                f"FIXTURE_IDENTITY_WRITE_FAILED:{exc}"\n            ) from exc\n\n    def _fetch_market_snapshots(\n''',
          )

          old_fixture_block = '''            repository = MatchdayRuntimeRepository()\n            fixture_identities = self._fixture_identities_from_response(\n                fixtures_response=fixtures_response,\n                fixtures=fixtures,\n            )\n            for fixture_identity in fixture_identities:\n                _persisted, changed_fixture_ids = (\n                    repository.upsert_fixture_identities_with_business_changes([fixture_identity])\n                )\n                if changed_fixture_ids:\n                    fixture_id = str(\n                        fixture_identity.get("provider_fixture_id")\n                        or fixture_identity.get("fixture_id")\n                        or ""\n                    )\n                    if fixture_id:\n                        self._record_projection_event(\n                            ProjectionSourceEvent.create(\n                                fixture_id=fixture_id,\n                                event_type="FIXTURE_CHANGED",\n                                event_id=(\n                                    "fixture:" + str(fixture_identity.get("identity_hash") or "")\n                                ),\n                                event_at=fixtures_response.captured_at,\n                                payload=fixture_identity,\n                            )\n                        )\n            observations: list[dict[str, Any]] = []\n'''
          replace_once(
              future,
              old_fixture_block,
              '''            repository = MatchdayRuntimeRepository()\n            observations: list[dict[str, Any]] = []\n''',
          )

          repository_path = Path("src/w2/ingestion/future_refresh_repository.py")
          replace_once(
              repository_path,
              '''            except IntegrityError:\n                session.rollback()\n                return 0\n            except Exception as exc:\n''',
              '''            except IntegrityError as exc:\n                session.rollback()\n                if self._lineup_snapshots_match_existing(\n                    fixture_id=fixture_id,\n                    captured_at=captured_at,\n                    snapshots=snapshots,\n                ):\n                    return 0\n                raise FutureRefreshPersistenceError(\n                    "LINEUP_SNAPSHOT_IDENTITY_CONFLICT"\n                ) from exc\n            except Exception as exc:\n''',
          )

          replace_once(
              repository_path,
              '''    def confirmed_lineup_business_identity(self, *, fixture_id: str) -> str | None:\n''',
              '''    def _lineup_snapshots_match_existing(\n        self,\n        *,\n        fixture_id: str,\n        captured_at: datetime,\n        snapshots: list[tuple[StructuredLineupSnapshotModel, list[dict[str, Any]]]],\n    ) -> bool:\n        expected_by_team = {\n            snapshot.team_external_id: (snapshot, players)\n            for snapshot, players in snapshots\n        }\n        with Session(self.engine) as session:\n            existing_rows = list(\n                session.scalars(\n                    select(StructuredLineupSnapshotModel).where(\n                        StructuredLineupSnapshotModel.fixture_id == fixture_id,\n                        StructuredLineupSnapshotModel.captured_at == captured_at,\n                        StructuredLineupSnapshotModel.team_external_id.in_(\n                            sorted(expected_by_team)\n                        ),\n                    )\n                )\n            )\n            existing_by_team = {row.team_external_id: row for row in existing_rows}\n            if set(existing_by_team) != set(expected_by_team):\n                return False\n            for team_id, (expected, expected_players) in expected_by_team.items():\n                existing = existing_by_team[team_id]\n                if (\n                    existing.team_name != expected.team_name\n                    or existing.formation != expected.formation\n                    or parse_db_datetime(existing.captured_at)\n                    != parse_db_datetime(expected.captured_at)\n                    or existing.confirmed != expected.confirmed\n                    or existing.authoritative_status != expected.authoritative_status\n                    or existing.raw_sha256 != expected.raw_sha256\n                    or existing.lineup_identity_hash != expected.lineup_identity_hash\n                    or existing.source_capture_id != expected.source_capture_id\n                    or existing.schema_version != expected.schema_version\n                ):\n                    return False\n                actual_players = list(\n                    session.scalars(\n                        select(StructuredLineupPlayerModel).where(\n                            StructuredLineupPlayerModel.lineup_snapshot_id == existing.id\n                        )\n                    )\n                )\n                expected_payload = sorted(\n                    [\n                        {\n                            "api_football_player_id": str(player["api_football_player_id"]),\n                            "player_name": str(player["player_name"]),\n                            "starter": bool(player["starter"]),\n                            "shirt_number": player.get("shirt_number"),\n                            "provider_position": player.get("provider_position"),\n                            "grid": player.get("grid"),\n                            "captain": bool(player.get("captain", False)),\n                        }\n                        for player in expected_players\n                    ],\n                    key=lambda item: (\n                        item["api_football_player_id"],\n                        not item["starter"],\n                    ),\n                )\n                actual_payload = sorted(\n                    [\n                        {\n                            "api_football_player_id": player.api_football_player_id,\n                            "player_name": player.player_name,\n                            "starter": player.starter,\n                            "shirt_number": player.shirt_number,\n                            "provider_position": player.provider_position,\n                            "grid": player.grid,\n                            "captain": player.captain,\n                        }\n                        for player in actual_players\n                    ],\n                    key=lambda item: (\n                        item["api_football_player_id"],\n                        not item["starter"],\n                    ),\n                )\n                if actual_payload != expected_payload:\n                    return False\n        return True\n\n    def confirmed_lineup_business_identity(self, *, fixture_id: str) -> str | None:\n''',
          )

          test_path = Path("tests/integration/test_future_refresh_db_persistence.py")
          replace_once(
              test_path,
              '''from sqlalchemy.orm import Session\n\nimport w2.prematch.analysis_calculator as api_repository\n''',
              '''from sqlalchemy.orm import Session\n\nimport pytest\n\nimport w2.prematch.analysis_calculator as api_repository\n''',
          )
          replace_once(
              test_path,
              '''from w2.ingestion.future_refresh_repository import (\n    FutureRefreshDbRepository,\n)\n''',
              '''from w2.ingestion.future_refresh_repository import (\n    FutureRefreshDbRepository,\n    FutureRefreshPersistenceError,\n)\n''',
          )
          replace_once(
              test_path,
              '''        if endpoint == "lineups":\n            return {\n                "response": [\n                    {"team": {"id": 10}, "startXI": [{} for _ in range(11)], "substitutes": []},\n                    {"team": {"id": 20}, "startXI": [{} for _ in range(11)], "substitutes": [{}]},\n                ]\n            }\n''',
              '''        if endpoint == "lineups":\n            def team_lineup(team_id: int, offset: int) -> dict[str, Any]:\n                return {\n                    "team": {"id": team_id, "name": f"Team {team_id}"},\n                    "formation": "4-3-3",\n                    "startXI": [\n                        {\n                            "player": {\n                                "id": offset + index,\n                                "name": f"Player {offset + index}",\n                                "number": index + 1,\n                                "pos": "G" if index == 0 else "M",\n                                "grid": f"{index // 4 + 1}:{index % 4 + 1}",\n                            }\n                        }\n                        for index in range(11)\n                    ],\n                    "substitutes": [],\n                }\n\n            return {"response": [team_lineup(10, 100), team_lineup(20, 200)]}\n''',
          )

          marker = "def test_c9_lineup_event_is_emitted_after_identity_and_capture_are_available"
          text = test_path.read_text(encoding="utf-8")
          if marker in text:
              raise SystemExit("C9 tests already present")
          text += '''\n\ndef test_c9_lineup_event_is_emitted_after_identity_and_capture_are_available(\n    tmp_path: Path,\n    monkeypatch: Any,\n) -> None:\n    configure_sqlite_db(monkeypatch, tmp_path)\n    key = deterministic_task_key(\n        competition_id="world_cup_2026",\n        season="2026",\n        now=NOW,\n        interval_seconds=900,\n    )\n    event_types: list[str] = []\n\n    def materialize(events: list[Any]) -> list[str]:\n        event_types.extend(str(event.event_type) for event in events)\n        return list(dict.fromkeys(str(event.fixture_id) for event in events))\n\n    audit = run_future_refresh_task(\n        task_id="task-c9-ordering",\n        key=key,\n        queued_at=NOW,\n        runtime_root=tmp_path / "runtime",\n        client=FakeApiFootballClient(),\n        now=NOW,\n        persistence="db",\n        materialize_public_artifacts=materialize,\n    )\n\n    assert audit.status == "COMPLETED", audit\n    assert set(event_types) == {"FIXTURE_CHANGED", "LINEUP_CHANGED", "ODDS_CHANGED"}\n\n\ndef test_c9_lineup_failure_is_explicit_and_preserves_paid_raw_evidence(\n    tmp_path: Path,\n    monkeypatch: Any,\n) -> None:\n    configure_sqlite_db(monkeypatch, tmp_path)\n\n    def reject_lineup(self: Any, **kwargs: Any) -> int:\n        raise FutureRefreshPersistenceError("INJECTED_LINEUP_WRITE_FAILURE")\n\n    monkeypatch.setattr(\n        FutureRefreshDbRepository,\n        "save_lineup_snapshots",\n        reject_lineup,\n    )\n    key = deterministic_task_key(\n        competition_id="world_cup_2026",\n        season="2026",\n        now=NOW,\n        interval_seconds=900,\n    )\n    client = FakeApiFootballClient()\n\n    audit = run_future_refresh_task(\n        task_id="task-c9-failure",\n        key=key,\n        queued_at=NOW,\n        runtime_root=tmp_path / "runtime",\n        client=client,\n        now=NOW,\n        persistence="db",\n        materialize_public_artifacts=materialize_projection_events_for_test,\n    )\n\n    assert audit.status == "BLOCKED"\n    assert audit.result["error_code"] == (\n        "LINEUP_MATERIALIZATION_FAILED:INJECTED_LINEUP_WRITE_FAILURE"\n    )\n    assert audit.result["raw_payload_written_count"] == 4\n    assert [endpoint for endpoint, _params in client.calls] == [\n        "status",\n        "fixtures",\n        "odds",\n        "lineups",\n    ]\n    engine = create_engine(get_settings().database_url.get_secret_value())\n    with Session(engine) as session:\n        endpoints = set(session.scalars(select(RawPayloadModel.endpoint)).all())\n        assert endpoints == {"status", "fixtures", "odds", "lineups"}\n        assert session.scalar(\n            select(func.count()).select_from(MatchdayMarketObservationModel)\n        ) == 0\n\n\ndef test_c9_lineup_integrity_conflict_is_noop_only_for_exact_replay(\n    tmp_path: Path,\n    monkeypatch: Any,\n) -> None:\n    configure_sqlite_db(monkeypatch, tmp_path)\n    repository = FutureRefreshDbRepository()\n    payload = FakeApiFootballClient().payload("lineups", {"fixture": "1489404"})\n\n    assert repository.save_lineup_snapshots(\n        fixture_id="1489404",\n        captured_at=NOW,\n        raw_sha256="a" * 64,\n        payload=payload,\n        materialize_baselines=False,\n    ) == 2\n    assert repository.save_lineup_snapshots(\n        fixture_id="1489404",\n        captured_at=NOW,\n        raw_sha256="a" * 64,\n        payload=payload,\n        materialize_baselines=False,\n    ) == 0\n\n    conflicting = json.loads(json.dumps(payload))\n    conflicting["response"][0]["formation"] = "3-5-2"\n    with pytest.raises(\n        FutureRefreshPersistenceError,\n        match="LINEUP_SNAPSHOT_IDENTITY_CONFLICT",\n    ):\n        repository.save_lineup_snapshots(\n            fixture_id="1489404",\n            captured_at=NOW,\n            raw_sha256="a" * 64,\n            payload=conflicting,\n            materialize_baselines=False,\n        )\n'''
          test_path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/agent-c9-patch.yml")
          workflow.unlink()
          PY
      - name: Commit exact patch
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git add src/w2/ingestion/future_refresh.py \
                  src/w2/ingestion/future_refresh_repository.py \
                  tests/integration/test_future_refresh_db_persistence.py \
                  .github/workflows/agent-c9-patch.yml
          git commit -m "fix: make lineup event ordering and failures explicit [agent-c9-applied]"
          git push origin HEAD:agent/eval-02b-c9-lineup-event-ordering
